[project]
name = "medgate"
version = "0.0.1"
description = "Evidence-gated EHR agent harness for MedAgentBench"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27",
    "requests>=2.31",  # imported by the benchmark grader's utils module
]

[project.scripts]
medgate = "medgate.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medgate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: needs the local FHIR container on port 8080"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90", "UP"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
