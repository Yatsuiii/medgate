<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">medgate</title>
  <desc id="d">medgate, a results watch for the hospital record. Three steps: it notices the new result, reads the protocol and drafts the order, and you review and approve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2233"/><stop offset="1" stop-color="#123a52"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <rect x="64" y="52" width="64" height="64" rx="16" fill="#14a38b"/>
    <g transform="translate(76 64) scale(1.667)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
    </g>
    <text x="148" y="100" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1">medgate</text>
    <text x="64" y="156" font-size="28" fill="#eaf2f7">A results watch for the hospital record.</text>
    <text x="64" y="190" font-size="19" fill="#9db8c6">Nemotron on Nebius Token Factory drafts the orders. A person approves every one.</text>
    <g font-size="18" fill="#eaf2f7">
      <circle cx="78" cy="248" r="14" fill="#2a4a60"/><text x="78" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
      <text x="102" y="254">Notices the new result</text>
      <text x="318" y="254" fill="#6b8696">&#8594;</text>
      <circle cx="362" cy="248" r="14" fill="#2a4a60"/><text x="362" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
      <text x="386" y="254">Reads the protocol and drafts the order</text>
      <text x="756" y="254" fill="#6b8696">&#8594;</text>
      <circle cx="800" cy="248" r="14" fill="#14a38b"/><text x="800" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
      <text x="824" y="254" font-weight="700">You review and approve</text>
    </g>
  </g>
</svg>
